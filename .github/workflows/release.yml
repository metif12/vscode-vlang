name: Release

# Tags are bare semver here -- 0.1.15, not v0.1.15 -- even though the release
# itself is named v0.1.15. Both spellings are matched so the convention can
# change without the workflow silently never firing; a trigger that never
# matches is invisible until someone wonders why no release appeared.
# Pre-releases use a hyphen-suffixed tag on the same numeric base
# (e.g. 0.2.1-rc.1 for package.json 0.2.1): package.json stays numeric because
# the Marketplace rejects semver prerelease versions, and the workflow builds
# a pre-release-marked VSIX for those tags.
on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  # So the packaging steps can be exercised without pushing a tag, which is
  # otherwise the only way to find out whether this file is wrong.
  workflow_dispatch:

# Least privilege: nothing in this workflow runs with implicit token scopes.
# The release job below declares exactly what it uses (`contents: write`
# to attach the VSIX to the GitHub Release, `actions: read` to verify CI
# passed on the tagged SHA). In particular no `id-token: write` is granted
# anywhere here: publishing uses PATs (see below); a future switch to
# trusted publishing needs a separate minimal publish job.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # A release is written against the tag, so the job needs contents: write.
    # Everything else is read-only, and the checkout is the tagged tree: what
    # gets published is what CI already verified on that SHA.
    # No `id-token: write` here: this job runs `npm ci`, tests, build, and
    # packaging before publishing, so any of that code could request an OIDC
    # token. Publishing below uses PATs; a future switch to trusted
    # publishing (`vsce publish --oidc`) needs a separate minimal publish
    # job that only gets `id-token: write` and the built VSIX.
    permissions:
      contents: write
      # Read the CI workflow runs to refuse publishing a tag whose SHA never
      # passed CI (see the gate step below).
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Do not persist the `contents: write` token in `.git/config`:
          # `npm ci`, the tests, and the build below execute dependency and
          # repo code that could read it there and push commits or cut
          # releases with it. Steps that need the API (`gh ...`) pass
          # `github.token` explicitly via `GH_TOKEN` instead; nothing below
          # performs an authenticated git operation (the tag SHA lookup is a
          # local `git rev-list`, the master check is a `gh api` call).
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tag matches package.json version
        # The tag may be `0.2.1` or `v0.2.1`; both must equal package.json.
        # Prereleases use a hyphen-suffixed tag (e.g. `0.2.1-rc.1`) whose
        # numeric base must equal package.json: package.json itself stays
        # numeric because the Marketplace rejects semver prerelease versions
        # such as `0.3.0-rc.1`. Failing here beats publishing a VSIX whose
        # embedded version disagrees with the release tag.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${pkg%%-*}" ]; then
            echo "package.json version $pkg has a hyphen suffix; the Marketplace rejects semver prerelease versions. Keep package.json numeric (e.g. 0.3.0) and tag prereleases as 0.3.0-rc.1."
            exit 1
          fi
          if [ "$tag" = "$pkg" ]; then
            echo "PRE_RELEASE=" >> "$GITHUB_ENV"
          elif [ "${tag%%-*}" = "$pkg" ] && [ "$tag" != "${tag%%-*}" ]; then
            # Hyphen-suffixed tag on the same numeric base: a pre-release that
            # must be marked as such on both registries; otherwise it would be
            # published as stable. The Package step below builds a
            # pre-release-marked VSIX when $PRE_RELEASE is set, and the vsce
            # publish step below expands it.
            echo "PRE_RELEASE=--pre-release" >> "$GITHUB_ENV"
          else
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg (expected $pkg, or $pkg-<suffix> for pre-releases)"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/')
      # A release is published only from a tree that passed, so the gates run
      # again here rather than being assumed from the earlier CI run.
      - name: Run tests
        run: npm test
      - name: Run grammar tests
        run: npm run test:grammar
      - name: Build
        run: npm run build
      - name: Package
        # vsce publish --pre-release fails on a VSIX that was not packaged as
        # a pre-release, and ovsx ignores --pre-release for a prebuilt VSIX, so
        # the marker must be baked in here: build a pre-release-marked VSIX
        # when the tag is a hyphen-suffixed pre-release, plain otherwise.
        # --no-install runs the lockfile-pinned binary from `npm ci`.
        run: |
          if [ -n "$PRE_RELEASE" ]; then
            npm run build:prod && npx --no-install vsce package --pre-release
          else
            npm run package
          fi
      # Publishing is only meaningful from a tree CI verified: this workflow
      # runs its own unit/type/lint/grammar/build/package gates, but not the
      # extension-host matrix (VS Code integration tests on ubuntu/macos with
      # fixture and real VLS servers). A tag pushed on a SHA that never passed
      # CI must not publish, so refuse when the CI workflow has no successful
      # run for the tagged commit.
      - name: Require green CI on the tagged SHA
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          conclusion="$(gh run list --commit "$sha" --workflow 'CI' --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          if [ "$conclusion" != 'success' ]; then
            echo "No successful CI run for tag $GITHUB_REF_NAME ($sha); refusing to publish (got: '${conclusion:-none}')."
            exit 1
          fi
          # Tags can be pushed on any commit; only publish what maintainers
          # merged to master. A tag on an unmerged branch that passed CI must
          # not publish. Compare via the API so shallow checkouts still work.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...master" --jq '.status')"
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "Tag $GITHUB_REF_NAME points at $sha, which is not on master (compare status: '${status:-none}'); refusing to publish."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Tag pushes only: a manual `workflow_dispatch` from a branch must not
      # create a GitHub Release (or tag) from that branch. Dispatch stays a
      # packaging dry run -- it builds the VSIX locally and uploads nothing.
      - name: Attach the VSIX to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # The tag may arrive with no release yet (a maintainer pushed it), or
          # with one already created on GitHub by tagging a release. Both land
          # the same way: create if absent, reconcile if present, then upload.
          # Pre-release tags (e.g. 0.2.1-rc.1) need a GitHub pre-release to
          # match the pre-release-marked VSIX.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -n "$PRE_RELEASE" ]; then
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
            else
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
            fi
          else
            # The release was created beforehand (e.g. drafted on GitHub
            # before the tag was pushed) and may carry the wrong status: a
            # pre-created stable release would stay stable under a
            # pre-release tag even though the VSIX is pre-release-marked
            # (and vice versa). Verify before uploading and fix a mismatch.
            is_prerelease="$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')"
            if [ -n "$PRE_RELEASE" ] && [ "$is_prerelease" != "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            elif [ -z "$PRE_RELEASE" ] && [ "$is_prerelease" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease=false
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # workflow_dispatch stays a packaging dry run: nothing is attached or
      # published. Attaching and publishing happen only on a tag push. Both
      # publish steps are idempotent on re-runs (--skip-duplicate).
      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # --no-install runs the lockfile-pinned binary from `npm ci` and fails
        # instead of fetching code from the registry while the publish token is
        # in the environment. $PRE_RELEASE is set only for hyphen-suffixed tags,
        # and vsce rejects --pre-release on a VSIX without the marker, so the
        # Package step above must have baked it in first.
        run: npx --no-install vsce publish --packagePath ./*.vsix --skip-duplicate $PRE_RELEASE
        env:
          # PAT with publish rights for the `vlanguage` publisher. A future
          # switch to trusted publishing (`vsce publish --oidc`) needs a
          # separate minimal job with `id-token: write`; do not grant it to
          # this job, which runs untrusted build code before publishing.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # Pinned via the `ovsx` devDependency: --no-install runs the
        # lockfile-installed binary and fails instead of installing the
        # latest ovsx from the registry while OVSX_PAT is in the environment.
        # No --pre-release flag here: ovsx ignores packaging flags for a
        # prebuilt VSIX, and the Package step above already baked the
        # pre-release marker into the VSIX when the tag is a pre-release.
        run: npx --no-install ovsx publish --packagePath ./*.vsix --skip-duplicate
        env:
          # Personal access token from https://open-vsx.org/user-settings/tokens
          # with publish rights for the `vlanguage` namespace.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
